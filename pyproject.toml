[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-datagen"
version = "1.0.0"
description = "Self-contained synthetic typical_price timeseries generator with plugin architecture"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Harvey Bastidas", email = "harveybc@users.noreply.github.com"}]
keywords = ["synthetic-data", "timeseries", "gan", "vae", "financial"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "tensorflow>=2.14",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "deap>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
sdg = "app.main:main"

[project.entry-points."sdg.trainer"]
vae_trainer = "sdg_plugins.trainer.vae_trainer:VaeTrainer"
gan_trainer = "sdg_plugins.trainer.gan_trainer:GanTrainer"
vae_gan_trainer = "sdg_plugins.trainer.vae_gan_trainer:VaeGanTrainer"
stationary_bootstrap_ohlcv_trainer = "sdg_plugins.trainer.stationary_bootstrap_ohlcv_trainer:StationaryBootstrapOhlcvTrainer"
regime_residual_bootstrap_ohlcv_trainer = "sdg_plugins.trainer.regime_residual_bootstrap_ohlcv_trainer:RegimeResidualBootstrapOhlcvTrainer"

[project.entry-points."sdg.generator"]
typical_price_generator = "sdg_plugins.generator.typical_price_generator:TypicalPriceGenerator"
stationary_bootstrap_ohlcv_generator = "sdg_plugins.generator.stationary_bootstrap_ohlcv_generator:StationaryBootstrapOhlcvGenerator"
regime_residual_bootstrap_ohlcv_generator = "sdg_plugins.generator.regime_residual_bootstrap_ohlcv_generator:RegimeResidualBootstrapOhlcvGenerator"

[project.entry-points."sdg.evaluator"]
distribution_evaluator = "sdg_plugins.evaluator.distribution_evaluator:DistributionEvaluator"
predictive_evaluator = "sdg_plugins.evaluator.predictive_evaluator:PredictiveEvaluator"
augmentation_evaluator = "sdg_plugins.evaluator.augmentation_evaluator:AugmentationEvaluator"
ohlcv_algebraic_evaluator = "sdg_plugins.evaluator.ohlcv_algebraic_evaluator:OhlcvAlgebraicEvaluator"
financial_stylized_facts_evaluator = "sdg_plugins.evaluator.financial_stylized_facts_evaluator:FinancialStylizedFactsEvaluator"
financial_distribution_evaluator = "sdg_plugins.evaluator.financial_distribution_evaluator:FinancialDistributionEvaluator"
memorization_evaluator = "sdg_plugins.evaluator.memorization_evaluator:MemorizationEvaluator"
augmentation_manifest_pipeline = "sdg_plugins.pipeline.augmentation_manifest_pipeline:AugmentationManifestPipeline"

[project.entry-points."sdg.optimizer"]
ga_optimizer = "sdg_plugins.optimizer.ga_optimizer:GaOptimizer"

[project.entry-points."sdg.transformer"]
ohlcv_transformer = "sdg_plugins.transformer.ohlcv_transformer:OhlcvTransformer"

[project.entry-points."sdg.reconstructor"]
ohlcv_reconstructor = "sdg_plugins.reconstructor.ohlcv_reconstructor:OhlcvReconstructor"

[project.entry-points."sdg.feature_engine"]
minimal_financial_feature_engine = "sdg_plugins.feature_engine.minimal_financial_feature_engine:MinimalFinancialFeatureEngine"
tech_stat_feature_engine = "sdg_plugins.feature_engine.tech_stat_feature_engine:TechStatFeatureEngine"

[project.entry-points."sdg.aggregator"]
ohlcv_timeframe_aggregator = "sdg_plugins.aggregator.ohlcv_timeframe_aggregator:OhlcvTimeframeAggregator"

[project.entry-points."sdg.pipeline"]
augmentation_manifest_pipeline = "sdg_plugins.pipeline.augmentation_manifest_pipeline:AugmentationManifestPipeline"

[tool.setuptools.packages.find]
include = ["app*", "sdg_plugins*"]
